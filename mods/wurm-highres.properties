version=0.1.31
updateProvider=chamomilo
updateCoordinatorProtocol=1
updateId=wurm-highres
updateName=High Res Icons
updateRepo=chamomilo/wurm-high-res-icons
updateAsset=WURM-High-Res-Icons-{version}.zip
classname=org.wurmhighres.client.WurmHighresMod
classpath=wurm-highres-0.1.31.jar
sharedClassLoader=true

# Detailed replacement atlases.
replaceIcons=true
resourcePack=mods/wurm-highres/wurm-highres-resources-0.1.31.jar

# Diamond-like animated rainbow refraction on magic water skins and Santa sacks.
magicShimmer=true

# Rarity effects in Inventory, Toolbelt and Equipment (paper doll).
rarityGlow=true
rarityBackground=false
# Animation under a rare item: blob or star.
rarityAnimation=blob
pulseGlow=true
glowRadius=3
glowAlpha=0.48
backgroundAlpha=0.16

# RGB colors. Hex values such as #4299E0 are also accepted.
rareColor=66,153,224
supremeColor=0,255,255
fantasticColor=255,0,255
