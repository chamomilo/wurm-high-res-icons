classname=org.wurmhighres.client.WurmHighresMod
classpath=wurm-highres-0.1.26.jar
sharedClassLoader=true

# Icon set: readable or realistic. Restart the client after changing it.
iconStyle=realistic

# Detailed replacement atlases.
replaceIcons=true
readableResourcePack=mods/wurm-highres/wurm-highres-resources-readable-0.1.26.jar
realisticResourcePack=mods/wurm-highres/wurm-highres-resources-realistic-0.1.26.jar

# Diamond-like animated rainbow refraction on magic water skins and Santa sacks.
magicShimmer=true

# Optional advanced override. When set, it takes precedence over iconStyle.
# resourcePack=mods/wurm-highres/custom-resource-pack.jar

# Rarity effects in Inventory, Toolbelt and Equipment (paper doll).
rarityGlow=true
rarityBackground=false
# Animation under a rare item: blob or star.
rarityAnimation=blob
pulseGlow=true
glowRadius=3
glowAlpha=0.48
backgroundAlpha=0.16

# RGB colors. Hex values such as #4299E0 are also accepted.
rareColor=66,153,224
supremeColor=0,255,255
fantasticColor=255,0,255
