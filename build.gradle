task dist(type: Zip, dependsOn: [test, verifyArtifacts]) {
    archiveFileName = "wurm-highres-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into('mods/wurm-highres') {
        from jar
        from resourcePack
    }
    into('mods') {
        from 'mods/wurm-highres.properties'
    }
    from 'README.txt'
}

task publicationZip(type: Zip, dependsOn: [test, verifyArtifacts]) {
    archiveFileName = "WURM-High-Res-Icons-${project.version}.zip"
    destinationDirectory = file("${buildDir}/publication")

    into('mods/wurm-highres') {
        from jar
        from resourcePack
    }
    into('mods') {
        from 'mods/wurm-highres.properties'
    }
    from 'README.txt'
}

[dist, publicationZip].each { distribution ->
    distribution.duplicatesStrategy = DuplicatesStrategy.FAIL
    distribution.doLast {
        def expected = [
                'README.txt',
                'mods/wurm-highres.properties',
                'mods/wurm-highres/' + jar.archiveFileName.get(),
                'mods/wurm-highres/' + resourcePack.archiveFileName.get()
        ] as Set
        def archive = new java.util.zip.ZipFile(distribution.archiveFile.get().asFile)
        try {
            def actual = archive.entries().findAll { !it.directory }.collect { it.name }
            if (actual.size() != expected.size() || actual.toSet() != expected) {
                throw new GradleException('Distribution must contain only runtime mod files and README.txt: ' + actual)
            }
            if (!java.util.Arrays.equals(archive.getInputStream(archive.getEntry('README.txt')).bytes,
                    file('README.txt').bytes)) {
                throw new GradleException('Distribution README.txt differs from source')
            }
            logger.lifecycle('Verified distribution: three runtime files and README.txt')
        } finally { archive.close() }
    }
}

build.dependsOn verifyArtifacts

ext.chamomiloUpdate = [id: 'wurm-highres', name: 'High Res Icons', repo: 'chamomilo/wurm-high-res-icons', asset: 'WURM-High-Res-Icons-{version}.zip', properties: 'mods/wurm-highres.properties', main: 'src/main/java/org/wurmhighres/client/WurmHighresMod.java']
apply from: 'gradle/chamomilo-updater.gradle'
