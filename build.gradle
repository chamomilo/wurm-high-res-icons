task dist(type: Zip, dependsOn: [test, verifyArtifacts]) {
    archiveFileName = "wurm-highres-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into('mods/wurm-highres') {
        from jar
        from resourcePack
    }
    into('mods') {
        from 'mods/wurm-highres.properties'
    }
}

task publicationZip(type: Zip, dependsOn: [test, verifyArtifacts]) {
    archiveFileName = "WURM-High-Res-Icons-${project.version}.zip"
    destinationDirectory = file("${buildDir}/publication")

    into('mods/wurm-highres') {
        from jar
        from resourcePack
    }
    into('mods') {
        from 'mods/wurm-highres.properties'
    }
}

build.dependsOn verifyArtifacts
